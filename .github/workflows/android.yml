name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        working-directory: android
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Store APK in versions/android
        run: |
          V="${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}"
          mkdir -p "versions/android/$V"
          cp android/app/build/outputs/apk/release/app-release.apk "versions/android/$V/MangaVault-$V.apk"
          rm -f android/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "versions/android/$V"
          git commit -m "Android APK $V [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish build log on failure
        if: failure()
        run: |
          if [ -f android/build.log ]; then cp android/build.log /tmp/build.log; else echo "no build log" > /tmp/build.log; fi
          grep -E "^e: |error:|What went wrong|FAILURE" -A3 /tmp/build.log > /tmp/errors.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --quiet --cached .
          git clean -fdxq
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/build.log /tmp/errors.txt .
          git add build.log errors.txt
          git commit -qm "Android build log ${{ github.sha }}"
          git push -f origin HEAD:ci-logs
